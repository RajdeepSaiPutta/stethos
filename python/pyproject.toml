[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "respiratory-ai-workstation"
version = "0.1.0"
description = "Local multimodal respiratory diagnostics workstation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["inference*", "models*", "plugins*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py310"