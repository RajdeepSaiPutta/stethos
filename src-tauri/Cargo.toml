[package]
name = "stethos"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
# `devtools` is REQUIRED for diagnosis in the shipped binary: without it the
# release/production build has no Ctrl+Shift+I webview inspector, which is the
# only way to see console logs and exceptions in the built app.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
[features]
# REQUIRED for a standalone release binary: embeds the built frontend
# (frontendDist) and serves it through the tauri protocol. without this
# feature the release app loads devUrl (localhost:1420) and dies with
# "could not connect: connection refused" whenever vite isn't running.
custom-protocol = ["tauri/custom-protocol"]
