name: Build installers

on:
  workflow_dispatch:
    inputs:
      cuda:
        description: Bundle CUDA torch on Linux/Windows (large, ~2.5 GB)
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x64
            platform: linux
            bundles: deb,rpm,appimage
          - os: windows-latest
            label: Windows x64
            platform: windows
            bundles: nsis,msi
          - os: macos-latest
            label: macOS arm64
            platform: macos
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm

      - name: Install npm dependencies
        run: npm ci

      # ---- inference sidecar -------------------------------------------------
      - name: Install Python build dependencies (CPU)
        if: ${{ !inputs.cuda || matrix.platform == 'macos' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements-sidecar.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install Python build dependencies (CUDA)
        if: ${{ inputs.cuda && matrix.platform != 'macos' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements-sidecar.txt
          python -m pip install --force-reinstall torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu126

      - name: Build inference sidecar
        working-directory: python
        run: python -m PyInstaller --clean -y sidecar.spec

      # ---- desktop shell -----------------------------------------------------
      - name: Build installers
        run: node scripts/build-installers.mjs --bundles ${{ matrix.bundles }}

      - name: Checksums (Linux/macOS)
        if: matrix.platform != 'windows'
        working-directory: release/${{ matrix.platform }}
        run: sha256sum -c SHA256SUMS.txt || shasum -a 256 -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: stethos-${{ matrix.platform }}
          path: release/${{ matrix.platform }}/*
          if-no-files-found: error

  publish:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
